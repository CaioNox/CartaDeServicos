# Uma vez por semana, testa os links externos do guia (normas no Planalto,
# Portal gov.br, CGU...). Não bloqueia nada: só avisa no resumo da execução,
# porque sites do governo às vezes ficam fora do ar por algumas horas.
name: Conferir links externos

on:
  schedule:
    - cron: "17 11 * * 1"   # segunda-feira, 08:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept 200,206,301,302,403,429
            --exclude-path vendor
            './**/*.html'
          fail: false
          jobSummary: true
