<body>
  <main class="slide">
    <div class="top-accent"></div>
    <div class="top-accent-2"></div>

    <header class="cab">
      <div class="cab-titulo">
        <h1>Normas de referência</h1>
      </div>
      <div class="cab-cap">
        <i class="fas fa-book" aria-hidden="true"></i>
        <div>
          <p class="n">CAPÍTULO 06</p>
          <p class="t">Apêndice</p>
        </div>
      </div>
    </header>

    <div class="corpo">
      <p class="lead">Clique em uma norma para ver os artigos que importam para a Carta.</p>
      <div class="grade g2 cresce" style="align-content:start;gap:.45rem .7rem">
        <button type="button" class="tile" data-badge="01" data-title="Lei nº 13.460/2017" data-sub="Código de Defesa do Usuário do Serviço Público">
          <span class="tile-n">01</span>
          <span><span class="tile-t">Lei nº 13.460/2017</span><span class="tile-d">Código de Defesa do Usuário do Serviço Público</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p><b>Art. 7º</b> obriga a divulgar a Carta, define o conteúdo mínimo (§§2º e 3º) e exige atualização periódica e divulgação permanente no site (§4º).</p><p><b>Arts. 13 e 14</b> dão à ouvidoria o papel de acompanhar a prestação dos serviços, propor melhorias e produzir relatório de gestão. <b>Art. 23</b>: avaliação continuada dos serviços.</p><p><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13460.htm" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
        <button type="button" class="tile" data-badge="02" data-title="Decreto nº 9.094/2017" data-sub="Regulamenta a Carta no Executivo federal">
          <span class="tile-n">02</span>
          <span><span class="tile-t">Decreto nº 9.094/2017</span><span class="tile-d">Regulamenta a Carta no Executivo federal</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p><b>Art. 11</b>: conteúdo da Carta e compromissos de atendimento, inclusive o que fazer quando o sistema estiver indisponível. <b>Art. 18</b>: publicação no Portal gov.br e versão impressa nos locais de atendimento. <b>Art. 18-A</b>: proíbe exigir o que não estiver informado no Portal.</p><p><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/decreto/d9094.htm" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
        <button type="button" class="tile" data-badge="03" data-title="Decreto nº 9.492/2018" data-sub="Institui o Sistema de Ouvidoria (SisOuv)">
          <span class="tile-n">03</span>
          <span><span class="tile-t">Decreto nº 9.492/2018</span><span class="tile-d">Institui o Sistema de Ouvidoria (SisOuv)</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p><b>Art. 5º, IV</b>: acompanhar a implementação da Carta é objetivo do SisOuv. Também regulamenta os conselhos de usuários (alterado pelo Decreto nº 10.228/2020).</p><p><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/decreto/d9492.htm" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
        <button type="button" class="tile" data-badge="04" data-title="Portaria Normativa CGU nº 116/2024" data-sub="Orientações às unidades do SisOuv">
          <span class="tile-n">04</span>
          <span><span class="tile-t">Portaria Normativa CGU nº 116/2024</span><span class="tile-d">Orientações às unidades do SisOuv</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p><b>Art. 7º, VII</b>: zelar pela qualidade das informações da Carta. <b>Art. 56</b>: ouvidoria ativa. <b>Art. 60, VII</b>: o relatório de gestão (até 1º de abril) informa a atualização da Carta. <b>Art. 65</b>: atuação coordenada, atividades de elaboração e atualização e <b>revisão anual</b> (§2º).</p><p><a href="https://www.gov.br/mec/pt-br/canais_atendimento/ouvidoria/antiga/1256.PortariaCGU116_.pdf" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
        <button type="button" class="tile" data-badge="05" data-title="Lei nº 14.129/2021" data-sub="Lei do Governo Digital">
          <span class="tile-n">05</span>
          <span><span class="tile-t">Lei nº 14.129/2021</span><span class="tile-d">Lei do Governo Digital</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p><b>Art. 3º</b>: diretrizes de acesso digital e cumprimento dos compromissos da Carta. <b>Art. 18</b>: Carta como componente da prestação digital. <b>Art. 27, II</b>: direito de ser atendido nos termos da Carta.</p><p><a href="https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14129.htm" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
        <button type="button" class="tile" data-badge="06" data-title="Portaria SGD/MGI nº 1.083/2025" data-sub="Serviços no Portal gov.br">
          <span class="tile-n">06</span>
          <span><span class="tile-t">Portaria SGD/MGI nº 1.083/2025</span><span class="tile-d">Serviços no Portal gov.br</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p>Define a <b>unidade gestora do serviço</b> (art. 2º, V), as <b>cinco características</b> de serviço de atendimento (art. 3º) e atribui à unidade gestora manter as informações atualizadas no Portal (art. 6º, II).</p></span>
        </button>
        <button type="button" class="tile" data-badge="07" data-title="Decreto nº 12.198/2024" data-sub="Estratégia Federal de Governo Digital 2024–2027">
          <span class="tile-n">07</span>
          <span><span class="tile-t">Decreto nº 12.198/2024</span><span class="tile-d">Estratégia Federal de Governo Digital 2024–2027</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p>Estratégia vigente de governo digital, citada pela CGU entre as normas que sustentam a Carta.</p><p><a href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/decreto/d12198.htm" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
        <button type="button" class="tile" data-badge="08" data-title="Lei nº 15.263/2025" data-sub="Política Nacional de Linguagem Simples">
          <span class="tile-n">08</span>
          <span><span class="tile-t">Lei nº 15.263/2025</span><span class="tile-d">Política Nacional de Linguagem Simples</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p>Base para escrever a Carta sem siglas soltas, jargões e estrangeirismos (Guia CGU, item 3.6).</p><p><a href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15263.htm" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
        <button type="button" class="tile" data-badge="09" data-title="Lei nº 10.048/2000 e Lei nº 14.626/2023" data-sub="Atendimento prioritário">
          <span class="tile-n">09</span>
          <span><span class="tile-t">Lei nº 10.048/2000 e Lei nº 14.626/2023</span><span class="tile-d">Atendimento prioritário</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p>A Lei nº 14.626/2023 incluiu entre os que têm prioridade as <b>pessoas com transtorno do espectro autista, com mobilidade reduzida e os doadores de sangue</b>. O texto padrão das Cartas no Portal ainda não traz esses grupos.</p><p><a href="https://www.planalto.gov.br/ccivil_03/leis/l10048.htm" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
        <button type="button" class="tile" data-badge="10" data-title="Guia Orientativo da CGU" data-sub="Cartas de Serviços: Guia Orientativo ao SisOuv (dez/2025)">
          <span class="tile-n">10</span>
          <span><span class="tile-t">Guia Orientativo da CGU</span><span class="tile-d">Cartas de Serviços: Guia Orientativo ao SisOuv (dez/2025)</span></span>
          <i class="fas fa-plus mais" aria-hidden="true"></i>
          <span class="tile-full"><p>Base metodológica deste guia: papéis da unidade gestora e da ouvidoria e o passo a passo de 11 etapas para elaborar e atualizar a Carta.</p><p><a href="https://basedeconhecimento.cgu.gov.br/items/39f2fdb6-7d14-4175-ab2c-65d8771407be" target="_blank" rel="noopener noreferrer">Ler a norma completa</a></p></span>
        </button>
      </div>
    </div>
